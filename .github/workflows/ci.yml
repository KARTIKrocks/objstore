name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede an in-flight run when a PR is pushed to again. Runs on main are
# never cancelled — coverage and bench there are the recorded baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.27"]
        module: [".", "./s3", "./gcs", "./azure"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "./s3", "./gcs", "./azure"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Run tests with coverage
        working-directory: ${{ matrix.module }}
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ matrix.module }}/coverage.out
          flags: ${{ matrix.module }}
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "./s3", "./gcs", "./azure"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          args: --timeout=5m
          working-directory: ${{ matrix.module }}

  # Not redundant with Dependabot or CodeQL, which cover different things:
  # Dependabot reports that a dependency is behind, CodeQL looks for bug
  # patterns in our own code. govulncheck cross-references the Go
  # vulnerability database against the call graph, so it reports only
  # advisories this code actually reaches.
  #
  # Scanned per module for the same reason `lint` is: each backend's ./...
  # stops at its own module boundary, so s3/gcs/azure's dependency trees are
  # invisible to a scan run from the root.
  vuln:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "./s3", "./gcs", "./azure"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # Version comes from the Makefile so a local `make vuln` and this gate
      # run the same scanner. Nothing bumps it automatically — Dependabot does
      # not track `go install` lines — so refresh GOVULNCHECK_VERSION in the
      # Makefile deliberately.
      - name: Install govulncheck
        run: |
          version="$(make -s print-govulncheck-version)"
          echo "govulncheck $version"
          go install "golang.org/x/vuln/cmd/govulncheck@$version"
      - name: Scan
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Run benchmarks
        run: go test -bench=. -benchmem ./...

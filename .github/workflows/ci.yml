name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede an in-flight run when a PR is pushed to again. Runs on main are
# never cancelled — coverage and bench there are the recorded baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        go-version: ["1.27"]
        module: [".", "./s3", "./gcs", "./azure"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        module: [".", "./s3", "./gcs", "./azure"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Run tests with coverage
        working-directory: ${{ matrix.module }}
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ matrix.module }}/coverage.out
          flags: ${{ matrix.module }}
          fail_ci_if_error: false

  # ./azure lint on a cold cache went through three rounds of "just raise the
  # timeout" (5m/10m, then 15m/20m, then 25m/30m) and every one still got
  # cancelled at the wall — GitHub-hosted standard runners are far slower at
  # this than the machine it was measured on (~4m locally), and there is no
  # timeout worth being generous enough to reliably absorb that gap.
  #
  # The actual fix is to stop paying this cost somewhere it buys nothing:
  # Dependabot PRs only ever touch go.mod/go.sum, never .go source. Lint is
  # static analysis of source — with no source change, its result cannot
  # differ from the last time this same code was linted, no matter which
  # dependency version is now in go.sum. A bump that actually breaks
  # something (an incompatible API change) fails to compile, which `test`/
  # `coverage` below already catch — those keep running for Dependabot PRs,
  # only `lint` is skipped.
  #
  # This still leaves one rare cold-cache path: a human PR that bumps a
  # dependency itself, or the very first run against a go.sum a Dependabot
  # PR just merged. 45m/40m is one more, deliberately generous bump for that
  # — since Dependabot no longer hits this, it should be rare enough to
  # afford it. If a run ever needs this long again, don't raise it a fourth
  # time: local reproduction has never taken more than ~5m, so a real 45m+
  # run is evidence of an actual hang, not just a slow runner, and is worth
  # investigating properly rather than absorbing with a bigger number.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.actor != 'dependabot[bot]'
    strategy:
      matrix:
        module: [".", "./s3", "./gcs", "./azure"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          args: --timeout=40m
          working-directory: ${{ matrix.module }}

  # Structural linting for every Markdown file in the repo. This lives here
  # rather than in the Docs workflow because that one is path-filtered to
  # website/**, so a change to the root README or CONTRIBUTING.md would never
  # trigger it. Config and rule rationale: .markdownlint-cli2.jsonc.
  docs-lint:
    name: lint (markdown)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      # Run from the repository root, not website/. The config globs every .md
      # in the repo and globs resolve against the working directory, so running
      # this from website/ would silently check only the site's own pages.
      - name: Lint Markdown
        run: website/node_modules/.bin/markdownlint-cli2

  # Not redundant with Dependabot or CodeQL, which cover different things:
  # Dependabot reports that a dependency is behind, CodeQL looks for bug
  # patterns in our own code. govulncheck cross-references the Go
  # vulnerability database against the call graph, so it reports only
  # advisories this code actually reaches.
  #
  # Scanned per module for the same reason `lint` is: each backend's ./...
  # stops at its own module boundary, so s3/gcs/azure's dependency trees are
  # invisible to a scan run from the root.
  vuln:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        module: [".", "./s3", "./gcs", "./azure"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # Version comes from the Makefile so a local `make vuln` and this gate
      # run the same scanner. Nothing bumps it automatically — Dependabot does
      # not track `go install` lines — so refresh GOVULNCHECK_VERSION in the
      # Makefile deliberately.
      - name: Install govulncheck
        run: |
          version="$(make -s print-govulncheck-version)"
          echo "govulncheck $version"
          go install "golang.org/x/vuln/cmd/govulncheck@$version"
      - name: Scan
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Run benchmarks
        run: go test -bench=. -benchmem ./...

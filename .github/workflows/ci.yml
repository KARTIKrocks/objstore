name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede an in-flight run when a PR is pushed to again. Runs on main are
# never cancelled — coverage and bench there are the recorded baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        go-version: ["1.27"]
        module: [".", "./s3", "./gcs", "./azure"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        module: [".", "./s3", "./gcs", "./azure"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Run tests with coverage
        working-directory: ${{ matrix.module }}
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ matrix.module }}/coverage.out
          flags: ${{ matrix.module }}
          fail_ci_if_error: false

  # ./azure lint has failed seven straight attempts against v2.13.0: five
  # timeout escalations (5m/10m through 40m/45m), a --concurrency=4/
  # GOMAXPROCS=4 pin (verified afterwards against a real nproc of 4 — not
  # the cause), and a wider-margin run that made things worse, not better:
  # it ran the full 45m job ceiling without golangci-lint's own --timeout=40m
  # ever firing. A time-based context cancellation not firing regardless of
  # how long the work takes is evidence of an actual stall, not just slow
  # analysis — raising the number again was not going to fix that.
  #
  # v2.13.0 is also not what this was ever reproduced against locally:
  # local testing has been on v2.13.2 (already latest) the whole time, which
  # never showed this. v2.13.1 and v2.13.2 both bumped honnef.co/go/tools
  # (staticcheck's engine), and v2.13.2 includes "fix: decrease cache
  # entropy" — plausibly relevant to exactly this. Pinned version now comes
  # from the Makefile (see below) instead of being hardcoded here a second
  # time, so bumping it again means editing one place.
  #
  # If this still hangs on v2.13.2, the version wasn't it either — next step
  # is dropping the SSA/whole-program-analysis linters (unused, gocritic,
  # staticcheck, bodyclose, contextcheck) for ./azure specifically, not
  # another timeout number.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        module: [".", "./s3", "./gcs", "./azure"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Report runner CPU/memory (diagnostic for the ./azure lint slowness)
        if: matrix.module == './azure'
        run: |
          echo "nproc: $(nproc)"
          echo "cpuinfo processors: $(grep -c ^processor /proc/cpuinfo)"
          go env GOMAXPROCS || true
          free -h
      - name: Resolve golangci-lint version
        id: golangci-lint-version
        run: echo "version=$(make -s print-golangci-lint-version)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci-lint-version.outputs.version }}
          args: --timeout=40m -v
          working-directory: ${{ matrix.module }}

  # Structural linting for every Markdown file in the repo. This lives here
  # rather than in the Docs workflow because that one is path-filtered to
  # website/**, so a change to the root README or CONTRIBUTING.md would never
  # trigger it. Config and rule rationale: .markdownlint-cli2.jsonc.
  docs-lint:
    name: lint (markdown)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      # Run from the repository root, not website/. The config globs every .md
      # in the repo and globs resolve against the working directory, so running
      # this from website/ would silently check only the site's own pages.
      - name: Lint Markdown
        run: website/node_modules/.bin/markdownlint-cli2

  # Not redundant with Dependabot or CodeQL, which cover different things:
  # Dependabot reports that a dependency is behind, CodeQL looks for bug
  # patterns in our own code. govulncheck cross-references the Go
  # vulnerability database against the call graph, so it reports only
  # advisories this code actually reaches.
  #
  # Scanned per module for the same reason `lint` is: each backend's ./...
  # stops at its own module boundary, so s3/gcs/azure's dependency trees are
  # invisible to a scan run from the root.
  vuln:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        module: [".", "./s3", "./gcs", "./azure"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # Version comes from the Makefile so a local `make vuln` and this gate
      # run the same scanner. Nothing bumps it automatically — Dependabot does
      # not track `go install` lines — so refresh GOVULNCHECK_VERSION in the
      # Makefile deliberately.
      - name: Install govulncheck
        run: |
          version="$(make -s print-govulncheck-version)"
          echo "govulncheck $version"
          go install "golang.org/x/vuln/cmd/govulncheck@$version"
      - name: Scan
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Run benchmarks
        run: go test -bench=. -benchmem ./...

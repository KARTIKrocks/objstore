version: "2"

# Report every occurrence. The defaults (max-same-issues: 3) hide duplicates,
# which makes a lint failure look smaller than it is.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
    - gocyclo
    - revive
    - prealloc
    # Security scanning matters for a package that handles credentials and
    # talks to remote object stores over the network.
    - gosec
    # Error-handling discipline: %w-wrapped errors must be compared with
    # errors.Is/As, and sentinel errors must be named Err*.
    - errorlint
    - errname
    - nilerr
    - nilnesserr
    # Context and I/O correctness — every backend makes network calls that
    # must respect the caller's context and close response bodies.
    - contextcheck
    - fatcontext
    - noctx
    - bodyclose
    - durationcheck
    - makezero
    - wastedassign
    - unconvert
    # Correctness footguns.
    - asasalint
    - reassign
    - usestdlibvars
    - copyloopvar
    - intrange
    # Keep //nolint directives specific and explained.
    - nolintlint
  settings:
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: exported
    errcheck:
      # An unchecked type assertion panics; deliberate `_ =` discards still pass.
      check-type-assertions: true
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    paths:
      - node_modules
      - objstore-website/
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - errcheck
        path: examples/
      # Tests may assert on unwrapped errors, skip response-body cleanup on
      # fakes/mocks, and build requests without a context; none of that ships
      # to consumers.
      - linters:
          - bodyclose
          - errorlint
          - gosec
          - intrange
          - noctx
        path: _test\.go
      - linters:
          - gosec
        path: examples/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
